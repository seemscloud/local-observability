modules:
  http_2xx_ipv4:
    prober: http
    timeout: 3s
    http:
      method: GET
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes: []
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      tls_config:
        insecure_skip_verify: false

  tcp_connect_ipv4:
    prober: tcp
    timeout: 3s

  icmp_ipv4:
    prober: icmp
    timeout: 3s
    icmp:
      preferred_ip_protocol: ip4

  dns_udp_ipv4:
    prober: dns
    timeout: 3s
    dns:
      transport_protocol: udp
      preferred_ip_protocol: ip4
      query_name: bpi.faszyn.lan.bajojajo.com
      query_type: A
      valid_rcodes:
        - NOERROR
