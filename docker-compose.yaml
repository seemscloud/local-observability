name: ${COMPOSE_PROJECT_NAME:-observability}

x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  observability-loki:
    image: grafana/loki:3.7.0
    container_name: observability-loki
    hostname: observability-loki
    command:
      - -config.file=/etc/loki/config.yaml
      - -target=all
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3100"
    ports:
      - "${NODE_EXPORTER_LISTEN_ADDRESS:?set NODE_EXPORTER_LISTEN_ADDRESS}:3100:3100"
    volumes:
      - ./config/loki/config.yaml:/etc/loki/config.yaml:ro
      - observability-loki-data:/loki
    networks:
      - observability
    logging: *default-logging

  observability-node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: observability-node-exporter
    hostname: observability-node-exporter
    user: "0:0"
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/host/root
      - --path.sysfs=/host/sys
      - --web.listen-address=${NODE_EXPORTER_LISTEN_ADDRESS:?set NODE_EXPORTER_LISTEN_ADDRESS}:9100
    init: true
    network_mode: host
    pid: host
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    logging: *default-logging

  observability-smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.14.0
    container_name: observability-smartctl-exporter
    hostname: observability-smartctl-exporter
    user: "0:0"
    command:
      - --smartctl.device=/dev/nvme0
      - --smartctl.interval=60s
      - --smartctl.rescan=5m
    init: true
    privileged: true
    restart: unless-stopped
    expose:
      - "9633"
    ports:
      - "${NODE_EXPORTER_LISTEN_ADDRESS:?set NODE_EXPORTER_LISTEN_ADDRESS}:9633:9633"
    networks:
      - observability
    logging: *default-logging

  observability-blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: observability-blackbox-exporter
    hostname: observability-blackbox-exporter
    command:
      - --config.file=/etc/blackbox-exporter/blackbox.yaml
      - --web.listen-address=0.0.0.0:9115
    cap_add:
      - NET_RAW
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "9115"
    ports:
      - "${NODE_EXPORTER_LISTEN_ADDRESS:?set NODE_EXPORTER_LISTEN_ADDRESS}:9115:9115"
    volumes:
      - ./config/blackbox/blackbox.yaml:/etc/blackbox-exporter/blackbox.yaml:ro
    networks:
      - observability
    logging: *default-logging

  observability-cockpit:
    image: quay.io/cockpit/ws:362
    container_name: observability-cockpit
    hostname: observability-cockpit
    command:
      - /usr/local/bin/cockpit-start
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      COCKPIT_SSH_KEY_PATH: /run/secrets/cockpit-ssh-key
      COCKPIT_SSH_KNOWN_HOSTS_FILE: /run/secrets/cockpit-ssh-known-hosts
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "9090"
    secrets:
      - source: cockpit-ssh-key
        target: cockpit-ssh-key
        mode: 0400
      - source: cockpit-ssh-known-hosts
        target: cockpit-ssh-known-hosts
        mode: 0444
    volumes:
      - ./config/cockpit/cockpit.conf:/etc/cockpit/cockpit.conf:ro
      - ./ops/cockpit-start.sh:/usr/local/bin/cockpit-start:ro
    networks:
      - observability
    logging: *default-logging

  observability-portainer:
    image: portainer/portainer-ce:2.39.6-alpine
    container_name: observability-portainer
    hostname: observability-portainer
    entrypoint:
      - /usr/local/bin/portainer-start
    command:
      - --host=unix:///var/run/docker.sock
      - --admin-password-file=/run/secrets/portainer-admin-password
      - --trusted-origins=${PORTAINER_DOMAIN:?set PORTAINER_DOMAIN}
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "9443"
    secrets:
      - source: portainer-admin-password
        target: portainer-admin-password
        mode: 0400
      - source: portainer-encryption-key
        target: portainer
        mode: 0400
      - source: portainer-agent-secret
        target: portainer-agent-secret
        mode: 0400
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - observability-portainer-data:/data
      - ./ops/portainer-start.sh:/usr/local/bin/portainer-start:ro
    networks:
      - observability
    logging: *default-logging

  observability-portainer-agent:
    image: portainer/agent:2.39.6-alpine
    container_name: observability-portainer-agent
    hostname: observability-portainer-agent
    entrypoint:
      - /usr/local/bin/portainer-agent-start
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "9001"
    ports:
      - "${NODE_EXPORTER_LISTEN_ADDRESS:?set NODE_EXPORTER_LISTEN_ADDRESS}:9001:9001"
    secrets:
      - source: portainer-agent-secret
        target: portainer-agent-secret
        mode: 0400
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - ./ops/portainer-agent-start.sh:/usr/local/bin/portainer-agent-start:ro
    networks:
      - observability
    logging: *default-logging

  observability-portainer-peer:
    image: python:3.14-alpine
    container_name: observability-portainer-peer
    hostname: observability-portainer-peer
    entrypoint:
      - python3
      - /opt/portainer/peer.py
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      observability-portainer:
        condition: service_started
      observability-portainer-agent:
        condition: service_started
    environment:
      PORTAINER_PEER_NAME: ${PORTAINER_PEER_NAME:?set PORTAINER_PEER_NAME}
      PORTAINER_PEER_URL: tcp://${REMOTE_OBSERVABILITY_ADDRESS:?set REMOTE_OBSERVABILITY_ADDRESS}:9001
      PORTAINER_URL: https://observability-portainer:9443
    secrets:
      - source: portainer-admin-password
        target: portainer-admin-password
        mode: 0400
    volumes:
      - ./ops/portainer-peer.py:/opt/portainer/peer.py:ro
    networks:
      - observability
    logging: *default-logging

  observability-prometheus:
    image: prom/prometheus:v3.12.0
    container_name: observability-prometheus
    hostname: observability-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - observability-blackbox-exporter
      - observability-node-exporter
      - observability-smartctl-exporter
    expose:
      - "9090"
    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./config/prometheus/targets/${OBSERVABILITY_SITE:?set OBSERVABILITY_SITE}.json:/etc/prometheus/targets/compute.json:ro
      - ./config/prometheus/targets/blackbox.json:/etc/prometheus/targets/blackbox.json:ro
      - observability-prometheus-data:/prometheus
    networks:
      - observability
    logging: *default-logging

  observability-alloy:
    image: grafana/alloy:v1.18.1
    container_name: observability-alloy
    hostname: observability-alloy
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - observability-loki
    environment:
      OBSERVABILITY_HOST: ${OBSERVABILITY_HOST:?set OBSERVABILITY_HOST}
      OBSERVABILITY_SITE: ${OBSERVABILITY_SITE:?set OBSERVABILITY_SITE}
      REMOTE_LOKI_URL: http://${REMOTE_OBSERVABILITY_ADDRESS:?set REMOTE_OBSERVABILITY_ADDRESS}:3100/loki/api/v1/push
    expose:
      - "12345"
    ports:
      - "1514:1514/tcp"
      - "1514:1514/udp"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - observability-alloy-data:/var/lib/alloy/data
      - /etc/machine-id:/etc/machine-id:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log:/host/var/log:ro
      - /var/log/journal:/var/log/journal:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    logging: *default-logging

  observability-grafana:
    image: grafana/grafana:12.3
    container_name: observability-grafana
    hostname: observability-grafana
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - observability-loki
      - observability-prometheus
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_SYNC_TTL: "0"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/loki.json
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN}
      GF_SERVER_ENFORCE_DOMAIN: "true"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN}/
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - observability-grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
    logging: *default-logging

  observability-certbot-init:
    image: certbot/dns-cloudflare:v5.7.0
    container_name: observability-certbot-init
    hostname: observability-certbot-init
    entrypoint:
      - python3
      - /opt/certbot/manage.py
    command:
      - --init
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    environment:
      CERT_CHECK_INTERVAL_SECONDS: ${CERT_CHECK_INTERVAL_SECONDS:-43200}
      CERT_RENEW_BEFORE_DAYS: ${CERT_RENEW_BEFORE_DAYS:-3}
      CLOUDFLARE_PROPAGATION_SECONDS: ${CLOUDFLARE_PROPAGATION_SECONDS:-60}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN}
      COCKPIT_DOMAIN: ${COCKPIT_DOMAIN:?set COCKPIT_DOMAIN}
      PORTAINER_DOMAIN: ${PORTAINER_DOMAIN:?set PORTAINER_DOMAIN}
      PROMETHEUS_DOMAIN: ${PROMETHEUS_DOMAIN:?set PROMETHEUS_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?set LETSENCRYPT_EMAIL}
    secrets:
      - source: cloudflare-api-token
        target: cloudflare-api-token
        mode: 0400
    volumes:
      - ./config/certbot/manage.py:/opt/certbot/manage.py:ro
      - observability-certbot-certs:/etc/letsencrypt
      - observability-certbot-work:/var/lib/letsencrypt
      - observability-certbot-logs:/var/log/letsencrypt
    networks:
      - observability
    logging: *default-logging

  observability-nginx:
    image: nginx:1.30.4-alpine
    container_name: observability-nginx
    hostname: observability-nginx
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      observability-certbot-init:
        condition: service_completed_successfully
      observability-grafana:
        condition: service_started
      observability-cockpit:
        condition: service_started
      observability-portainer:
        condition: service_started
      observability-prometheus:
        condition: service_started
    environment:
      COCKPIT_DOMAIN: ${COCKPIT_DOMAIN:?set COCKPIT_DOMAIN}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN}
      PORTAINER_DOMAIN: ${PORTAINER_DOMAIN:?set PORTAINER_DOMAIN}
      PROMETHEUS_DOMAIN: ${PROMETHEUS_DOMAIN:?set PROMETHEUS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/grafana.conf.template:/etc/nginx/templates/default.conf.template:ro
      - observability-certbot-certs:/etc/letsencrypt:ro
      - observability-nginx-run:/var/run/nginx
    networks:
      - observability
    logging: *default-logging

  observability-certbot-renew:
    image: certbot/dns-cloudflare:v5.7.0
    container_name: observability-certbot-renew
    hostname: observability-certbot-renew
    entrypoint:
      - python3
      - /opt/certbot/manage.py
    command:
      - --loop
    init: true
    restart: unless-stopped
    pid: service:observability-nginx
    security_opt:
      - no-new-privileges:true
    depends_on:
      observability-nginx:
        condition: service_started
    environment:
      CERT_CHECK_INTERVAL_SECONDS: ${CERT_CHECK_INTERVAL_SECONDS:-43200}
      CERT_RENEW_BEFORE_DAYS: ${CERT_RENEW_BEFORE_DAYS:-3}
      CLOUDFLARE_PROPAGATION_SECONDS: ${CLOUDFLARE_PROPAGATION_SECONDS:-60}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN}
      COCKPIT_DOMAIN: ${COCKPIT_DOMAIN:?set COCKPIT_DOMAIN}
      PORTAINER_DOMAIN: ${PORTAINER_DOMAIN:?set PORTAINER_DOMAIN}
      PROMETHEUS_DOMAIN: ${PROMETHEUS_DOMAIN:?set PROMETHEUS_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?set LETSENCRYPT_EMAIL}
      NGINX_PID_FILE: /var/run/nginx/nginx.pid
    secrets:
      - source: cloudflare-api-token
        target: cloudflare-api-token
        mode: 0400
    volumes:
      - ./config/certbot/manage.py:/opt/certbot/manage.py:ro
      - observability-certbot-certs:/etc/letsencrypt
      - observability-certbot-work:/var/lib/letsencrypt
      - observability-certbot-logs:/var/log/letsencrypt
      - observability-nginx-run:/var/run/nginx
    networks:
      - observability
    logging: *default-logging

networks:
  observability:
    name: observability
    driver: bridge

volumes:
  observability-alloy-data:
    name: observability-alloy-data
  observability-certbot-certs:
    name: observability-certbot-certs
  observability-certbot-logs:
    name: observability-certbot-logs
  observability-certbot-work:
    name: observability-certbot-work
  observability-loki-data:
    name: observability-loki-data
  observability-prometheus-data:
    name: observability-prometheus-data
  observability-portainer-data:
    name: observability-portainer-data
  observability-grafana-data:
    name: observability-grafana-data
  observability-nginx-run:
    name: observability-nginx-run

secrets:
  cockpit-ssh-key:
    file: .cockpit/id_ed25519
  cockpit-ssh-known-hosts:
    file: .cockpit/known_hosts
  portainer-admin-password:
    file: .portainer/admin-password
  portainer-encryption-key:
    file: .portainer/encryption-key
  portainer-agent-secret:
    file: .portainer/agent-secret
  cloudflare-api-token:
    file: .env
